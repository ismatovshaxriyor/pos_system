# Docker'ning ichki DNS'i. Bu shart: `proxy_pass` yoki `upstream` ichida
# host nomi STATIK yozilsa, nginx uni faqat boot paytida bir marta hal
# qiladi va IP'ni abadiy keshlab qoladi. `web` konteyneri deploy'da qayta
# yaratilib yangi IP olganida nginx eskisiga urinaveradi -> hamrohpos.uz/api/
# va /admin/ 502 qaytaradi. Quyida backend host o'zgaruvchi orqali berilgani
# uchun nginx DNS'ni qayta hal qiladi (valid=10s TTL bilan).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Django backend manzili. O'zgaruvchi sifatida berilishi muhim -
    # yuqoridagi resolver izohiga qarang. `$request_uri` ham shart: o'zgaruvchili
    # proxy_pass'da nginx original URI'ni avtomatik uzatmaydi.
    set $backend_web "web:8001";

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django Gunicorn web container
    location /api/ {
        proxy_pass http://$backend_web$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Admin requests to Django Gunicorn web container
    location /admin/ {
        proxy_pass http://$backend_web$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin static files
    location /static/ {
        proxy_pass http://$backend_web$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
