<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jonli monitor</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;--text:#e6edf3;--muted:#8b97a5;
  --ok:#3fb950;--warn:#d29922;--crit:#f85149;--info:#58a6ff;--accent:#58a6ff;--shadow:0 8px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f4f6f9;--panel:#ffffff;--panel2:#f0f3f7;--line:#d8dee6;--text:#18212b;--muted:#5d6b7a;--ok:#1a7f37;--warn:#9a6700;--crit:#cf222e;--info:#0969da;--accent:#0969da;--shadow:0 8px 30px rgba(20,30,45,.18)}
}
:root[data-theme="light"]{--bg:#f4f6f9;--panel:#ffffff;--panel2:#f0f3f7;--line:#d8dee6;--text:#18212b;--muted:#5d6b7a;--ok:#1a7f37;--warn:#9a6700;--crit:#cf222e;--info:#0969da;--accent:#0969da;--shadow:0 8px 30px rgba(20,30,45,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:var(--crit);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px}
header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.live-on{animation:pulse 1.6s infinite}
.dot.off{background:var(--crit);animation:none}
.dot.paused{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.6)}100%{box-shadow:0 0 0 8px rgba(63,185,80,0)}}
.grow{flex:1}
nav.tabs{display:flex;gap:4px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .count{background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px}
main{padding:16px;max-width:1500px;margin:0 auto}
#banner{display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:rgba(248,81,73,.12);border:1px solid var(--crit);color:var(--crit)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:650;line-height:1.1}
.kpi .s{color:var(--muted);font-size:12px;margin-top:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.muted{color:var(--muted)}.info{color:var(--info)}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:48px}
.bar>i{display:block;height:100%;border-radius:5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.ok{border-color:var(--ok)}.chip.crit{border-color:var(--crit)}.chip.warn{border-color:var(--warn)}.chip.info{border-color:var(--info)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff}
.badge.online{background:var(--ok)}.badge.offline{background:var(--crit)}.badge.blocked,.badge.expired{background:#8250df}.badge.pending{background:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;background:var(--panel);cursor:default}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.tablewrap{overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pill{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.bulk{display:none;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;margin-bottom:10px;border:1px solid var(--accent);border-radius:10px;background:var(--panel)}
.bulk.show{display:flex}
.mini{display:flex;align-items:center;gap:6px;min-width:96px}
.mini .bar{flex:1}
.mini span{font-size:12px;width:34px;text-align:right}
.alerts-inline{display:flex;gap:4px;flex-wrap:wrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
svg text{fill:var(--muted);font-size:10px}
.chartwrap{width:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.feed{max-height:420px;overflow:auto}
.feed .item{padding:8px 0;border-bottom:1px dashed var(--line)}
.feed .item:last-child{border-bottom:0}
.feed small{color:var(--muted)}
details>summary{cursor:pointer;color:var(--accent)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;max-height:240px;font-size:11px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .2s;overflow:auto;box-shadow:var(--shadow)}
.drawer.show{transform:none}
.drawer .head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.drawer .body{padding:14px 16px;display:grid;gap:12px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:60;padding:18px;box-shadow:var(--shadow);display:none}
.modal.show{display:block}
.modal h2{margin:0 0 10px;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal label{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px}
.modal input,.modal select,.modal textarea{width:100%}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:80;max-width:min(380px,calc(100% - 28px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);animation:in .2s}
.toast.crit{border-left-color:var(--crit)}.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media (max-width:700px){main{padding:10px}.kpi .v{font-size:22px}.tablewrap{max-height:none}}
</style>
</head>
<body>
<header>
  <h1>⚡ Jonli monitor <span class="muted" style="font-weight:400">· hamrohpos</span></h1>
  <span class="live" id="live"><i class="dot live-on" id="dot"></i><span id="liveText">ulanmoqda…</span></span>
  <span class="grow"></span>
  <label class="live">Yangilanish
    <select id="interval">
      <option value="2000">2 s</option><option value="3000" selected>3 s</option>
      <option value="5000">5 s</option><option value="10000">10 s</option><option value="30000">30 s</option>
    </select>
  </label>
  <button class="btn" id="pauseBtn" title="Jonli yangilanishni to'xtatish (probel)">⏸ To'xtatish</button>
  <button class="btn" id="soundBtn" title="Jiddiy ogohlantirishda tovush">🔕 Tovush</button>
  <button class="btn" id="notifBtn" title="Brauzer bildirishnomalari">🔔 Bildirish</button>
  <button class="btn" id="themeBtn" title="Mavzu">🌓</button>
  <a class="btn" href="/admin/" style="text-decoration:none">← Admin</a>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">Umumiy</button>
  <button data-tab="server">Server</button>
  <button data-tab="fleet">Bolalar <span class="count" id="fleetCount" hidden></span></button>
  <button data-tab="events">Voqealar <span class="count" id="eventsCount" hidden></span></button>
</nav>
<main>
  <div id="banner"></div>
  <section id="view"></section>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ========================= yordamchilar ========================= */
const $ = (s, r = document) => r.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
// Bolalardan kelgan matnlar ishonchsiz: HECH QACHON innerHTML ishlatilmaydi, faqat textContent.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
function svg(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const fmtBytes = (n) => {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; n = Number(n);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + " " + u[i];
};
const fmtRate = (n) => (n == null ? "–" : fmtBytes(Math.max(0, n)) + "/s");
const fmtMoney = (v) => Math.round(Number(v) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
const pct = (v) => (v == null ? "–" : Math.round(v) + "%");
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d}k ${hh}s` : hh ? `${hh}s ${m}d` : m ? `${m} daq` : `${s} s`;
}
const ago = (ts) => (ts ? fmtDur(Date.now() / 1000 - ts) + " oldin" : "–");
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString("en-GB");
const dt = (ts) => new Date(ts * 1000).toLocaleString("en-GB", { hour12: false });
const level = (v, w = 70, c = 88) => (v == null ? "" : v >= c ? "crit" : v >= w ? "warn" : "ok");
const colorVar = (cls) => ({ ok: "var(--ok)", warn: "var(--warn)", crit: "var(--crit)" }[cls] || "var(--muted)");
const STATE = { online: "Onlayn", offline: "Oflayn", blocked: "Bloklangan", expired: "Muddati o'tgan", pending: "Faollashtirilmagan" };

function bar(v, w, c) {
  const cls = level(v, w, c);
  return h("div", { class: "bar" }, h("i", { style: { width: Math.min(100, Math.max(0, v || 0)) + "%", background: colorVar(cls) } }));
}
function mini(v) {
  return h("div", { class: "mini" }, bar(v), h("span", { class: level(v) }, pct(v)));
}
function chip(text, cls) { return h("span", { class: "chip " + (cls || "") }, text); }

/* ========================= grafiklar ========================= */
function lineChart(series, opt = {}) {
  const W = 640, H = opt.h || 140, L = 34, R = 8, T = 8, B = 18;
  const pts = series.flatMap((s) => s.points);
  const el = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chartwrap", preserveAspectRatio: "none", role: "img" });
  if (!pts.length) { el.append(svg("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, "ma'lumot yo'q")); return el; }
  const t0 = Math.min(...pts.map((p) => p[0])), t1 = Math.max(...pts.map((p) => p[0]), t0 + 1);
  const ymax = opt.max != null ? opt.max : Math.max(1, ...pts.map((p) => p[1])) * 1.15;
  const X = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
  const Y = (v) => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B);
  for (let i = 0; i <= 4; i++) {
    const y = T + (i / 4) * (H - T - B), val = ymax * (1 - i / 4);
    el.append(svg("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1 }));
    el.append(svg("text", { x: L - 4, y: y + 3, "text-anchor": "end" }, opt.fmt ? opt.fmt(val) : Math.round(val)));
  }
  el.append(svg("text", { x: L, y: H - 4 }, clock(t0)), svg("text", { x: W - R, y: H - 4, "text-anchor": "end" }, clock(t1)));
  for (const s of series) {
    if (s.points.length < 2) continue;
    const d = s.points.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    el.append(svg("path", { d, fill: "none", stroke: s.color, "stroke-width": 1.8, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
  }
  return el;
}
function legend(series) {
  return h("div", { class: "legend" }, series.map((s) => h("span", {}, h("b", { style: { background: s.color } }), s.name)));
}
function sparkline(values, color = "var(--accent)", W = 84, H = 22) {
  const v = values.filter((x) => x != null);
  const el = svg("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  if (v.length < 2) return el;
  const d = v.map((x, i) => (i ? "L" : "M") + ((i / (v.length - 1)) * W).toFixed(1) + " " + (H - 2 - (Math.min(x, 100) / 100) * (H - 4)).toFixed(1)).join(" ");
  el.append(svg("path", { d, fill: "none", stroke: color, "stroke-width": 1.5 }));
  return el;
}
function barChart(days, W = 640, H = 120) {
  const el = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chartwrap", preserveAspectRatio: "none" });
  if (!days.length) { el.append(svg("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, "ma'lumot yo'q")); return el; }
  const max = Math.max(1, ...days.map((d) => Number(d.revenue)));
  const bw = (W - 20) / days.length;
  days.forEach((d, i) => {
    const v = Number(d.revenue), bh = (v / max) * (H - 34);
    el.append(svg("rect", { x: 10 + i * bw + 4, y: H - 18 - bh, width: Math.max(2, bw - 8), height: Math.max(1, bh), rx: 3, fill: "var(--accent)", opacity: 0.85 }));
    el.append(svg("text", { x: 10 + i * bw + bw / 2, y: H - 5, "text-anchor": "middle" }, d.day.slice(5)));
    if (v) el.append(svg("text", { x: 10 + i * bw + bw / 2, y: H - 22 - bh, "text-anchor": "middle" }, fmtShort(v)));
  });
  return el;
}
const fmtShort = (v) => (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : Math.round(v));

/* ========================= holat ========================= */
const S = {
  snap: null, prev: null, hist: [], tab: "overview", filter: "all", sort: "problem", search: "",
  selected: new Set(), openId: null, detail: null, openErr: new Set(), paused: false, timer: null,
  sound: false, notif: false, netPrev: null, rates: { net_in: null, net_out: null, dr: null, dw: null },
  alertKeys: null, stateMap: null, failures: 0, pressing: false,
};
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("ops." + k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("ops." + k, JSON.stringify(v)); } catch (e) {} } };
function csrf() { const m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ""; }

async function api(path, opts) {
  const r = await fetch(path, { credentials: "same-origin", cache: "no-store", ...opts });
  if (r.status === 401) { showBanner("Sessiya tugagan. Sahifani yangilab, qayta kiring."); throw new Error("auth"); }
  return r;
}
function showBanner(t) { const b = $("#banner"); b.textContent = t; b.style.display = t ? "block" : "none"; }

/* ========================= toast / modal / bildirish ========================= */
function toast(text, cls = "", ms = 6000) {
  const t = h("div", { class: "toast " + cls }, text);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), ms);
}
let audioCtx = null;
function beep() {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.06; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}
function notify(title, body) {
  if (S.notif && "Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body }); } catch (e) {}
  }
}
function closeModal() { $("#modal").classList.remove("show"); if (!$("#drawer").classList.contains("show")) $("#overlay").classList.remove("show"); }
function openModal(title, bodyNodes, buttons) {
  const m = $("#modal");
  m.replaceChildren(h("h2", {}, title), ...bodyNodes, h("div", { class: "acts" }, buttons));
  m.classList.add("show"); $("#overlay").classList.add("show");
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    openModal(title, [h("p", {}, text)], [
      h("button", { class: "btn", onclick: () => { closeModal(); resolve(false); } }, "Bekor qilish"),
      h("button", { class: "btn " + (danger ? "danger" : "primary"), onclick: () => { closeModal(); resolve(true); } }, okLabel),
    ]);
  });
}

/* ========================= amallar ========================= */
const NEED_CONFIRM = { block: true, reset_hardware: true, mark_paid: true };
async function runAction(action, ids, params) {
  const names = S.snap ? S.snap.fleet.restaurants.filter((r) => ids.includes(r.id)).map((r) => r.name) : [];
  const label = (ACTIONS[action] || action) + ` — ${names.length > 3 ? names.slice(0, 3).join(", ") + ` va yana ${names.length - 3} ta` : names.join(", ")}`;
  if (NEED_CONFIRM[action] || (action === "update" && params && params.mode === "force")) {
    const ok = await confirmBox("Tasdiqlang", label + ". Davom etamizmi?", "Ha, bajarish", action === "block" || action === "reset_hardware" || (params && params.mode === "force"));
    if (!ok) return;
  }
  try {
    const r = await api("/admin/ops/api/action/", { method: "POST", headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() }, body: JSON.stringify({ action, restaurant_ids: ids, params }) });
    const j = await r.json();
    toast(j.message || (j.ok ? "Bajarildi" : "Xato"), j.ok ? "ok" : "crit");
    if (j.ok && j.token) showToken(j);
    if (j.ok) { S.selected.clear(); await poll(true); if (S.openId) loadDetail(S.openId); }
  } catch (e) { if (e.message !== "auth") toast("So'rov bajarilmadi: " + e.message, "crit"); }
}
function updateDialog(ids) {

function trackRates(sv) {
  const p = S.netPrev;
  if (p && sv.ts > p.ts) {
    const dt_ = sv.ts - p.ts;
    S.rates = {
      net_in: (sv.net.recv - p.recv) / dt_, net_out: (sv.net.sent - p.sent) / dt_,
      dr: sv.diskio && p.dr != null ? (sv.diskio.read - p.dr) / dt_ : null, dw: sv.diskio && p.dw != null ? (sv.diskio.write - p.dw) / dt_ : null,
    };
    S.hist.push({ ts: sv.ts, cpu: sv.cpu.percent, ram: sv.ram.percent, disk: sv.disk.percent, load1: sv.cpu.load[0], net_sent: sv.net.sent, net_recv: sv.net.recv });
    if (S.hist.length > 700) S.hist.splice(0, S.hist.length - 700);
  }
  S.netPrev = { ts: sv.ts, recv: sv.net.recv, sent: sv.net.sent, dr: sv.diskio ? sv.diskio.read : null, dw: sv.diskio ? sv.diskio.write : null };
}
function detectChanges(snap) {
  const states = {}, keys = new Set();
  for (const r of snap.fleet.restaurants) {
    states[r.id] = r.state;
    for (const a of r.alerts) if (a.level === "critical") keys.add(`${r.id}|${a.code}|${r.name}|${a.text}`);
  }
  for (const a of snap.server.alerts) if (a.level === "critical") keys.add(`server|${a.text}|Server|${a.text}`);
  if (S.stateMap) {
    for (const r of snap.fleet.restaurants) {
      const was = S.stateMap[r.id];
      if (was && was !== r.state) {
        if (r.state === "offline") { toast(`${r.name}: oflayn bo'ldi`, "crit"); notify("Bola oflayn", r.name); beep(); }
        else if (r.state === "online" && (was === "offline")) toast(`${r.name}: yana onlayn`, "ok");
        else if (r.state === "blocked") toast(`${r.name}: bloklandi`, "warn");
      }
    }
    for (const k of keys) {
      if (!S.alertKeys.has(k)) {
        const [, , who, text] = k.split("|");
        if (!k.includes("|offline|")) { toast(`${who}: ${text}`, "crit"); notify("Jiddiy ogohlantirish", `${who}: ${text}`); beep(); }
      }
    }
  }
  S.stateMap = states; S.alertKeys = keys;
}

/* ========================= boshqaruv ========================= */
function setTab(t) {
  S.tab = t; store.set("tab", t);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
  location.hash = t; render();

}

["pointerup", "pointercancel", "click"].forEach((ev) => document.addEventListener(ev, () => setTimeout(() => { S.pressing = false; }, 80), true));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeDrawer(); }
  if (e.key === " " && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $("#pauseBtn").click(); }
});
$("#interval").addEventListener("change", () => { store.set("interval", $("#interval").value); schedule(); });
$("#pauseBtn").addEventListener("click", () => {
  S.paused = !S.paused; $("#pauseBtn").textContent = S.paused ? "▶ Davom ettirish" : "⏸ To'xtatish";
  $("#dot").className = "dot " + (S.paused ? "paused" : "live-on"); $("#liveText").textContent = S.paused ? "to'xtatilgan" : "yangilanmoqda…";
  if (!S.paused) poll(true);
});
$("#soundBtn").addEventListener("click", () => { S.sound = !S.sound; store.set("sound", S.sound); $("#soundBtn").textContent = S.sound ? "🔊 Tovush" : "🔕 Tovush"; if (S.sound) beep(); });
$("#notifBtn").addEventListener("click", async () => {
  if (!("Notification" in window)) { toast("Brauzer bildirishnomalarni qo'llamaydi", "warn"); return; }
  if (!S.notif) { const p = await Notification.requestPermission(); S.notif = p === "granted"; } else S.notif = false;
  store.set("notif", S.notif); $("#notifBtn").textContent = S.notif ? "🔔 Bildirish: yoqiq" : "🔔 Bildirish";

$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");

  store.set("theme", next);

(async function init() {

  S.filter = store.get("filter", "all"); S.sort = store.get("sort", "problem");
